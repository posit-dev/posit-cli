[project]
name = "posit-cli"
version = "0.1.0"
description = "A single, friendly command-line interface for Posit Connect, in the spirit of gh."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Posit Software, PBC" }]
dependencies = [
    # posit-cli reuses rsconnect-python's *internal* API (RSConnectExecutor,
    # RSConnectClient). These have no stability contract, so keep this pin tight and
    # re-verify the internals on bumps. See tests/test_rsconnect_contract.py.
    "rsconnect-python>=1.29,<2",
    # rsconnect imports `keyring` optionally (it has no published `keyring` extra as
    # of 1.29.0). We depend on it directly so OAuth tokens land in the OS keyring
    # once rsconnect's OAuth `login` ships in a release.
    "keyring>=23.0",
    "click>=8.0",
]

[project.scripts]
posit = "posit_cli.__main__:cli"

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posit_cli"]
