name: Release
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: extractions/setup-just@v4
      # The tag is the only source of the version, so this only guards against a
      # build that did not pick the tag up (shallow clone, dirty tree, two tags on
      # one commit).
      - name: assert build version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver="$(just version)"
          if [ "$TAG" != "v$ver" ]; then
            echo "::error::tag '${TAG}' does not match build version 'v${ver}'"
            exit 1
          fi
      - name: assert tag is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag '${TAG}' points to a commit that is not on main"
            exit 1
          fi
      - run: just build
      - run: just smoke
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Runs only after PyPI accepts the upload, so a failed publish leaves no release.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes
